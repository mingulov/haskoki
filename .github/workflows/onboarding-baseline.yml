name: Onboarding regression baseline
on:
  push:
    branches: [demo/v0.3.1.0]
    paths: [.github/workflows/onboarding-baseline.yml]
permissions:
  contents: read
jobs:
  released-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          docker pull ghcr.io/mingulov/haskoki-demo@sha256:e440a66723c86340f49d3bf2d828095ea836b2dec9d7bd020d3593844d8bce5c
          sh scripts/test-demo-onboarding.sh ghcr.io/mingulov/haskoki-demo@sha256:e440a66723c86340f49d3bf2d828095ea836b2dec9d7bd020d3593844d8bce5c
