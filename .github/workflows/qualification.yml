name: Qualification (behavioral matrix)

# Qualification lane (V4b behavioral matrix on GitHub-hosted
# ubuntu-latest runners, which count as native x86_64 Linux execution
# of the same cells; builds on the merged V4a lane): manual dispatch (Actions -> Run workflow,
# with an optional exact revision) plus one bounded weekly schedule.
# The lane never runs on branch or tag activity, and PR scope stays
# explicit in the CI workflow: this file adds no push,
# pull_request, or tag trigger.
#
# Permissions are read-only at the top level and no job widens them.
# Nothing here creates tags, drafts, attestations, or registry entries:
# the toolchain image is built with load-only semantics for same-run
# use, and the proxy pair is rebuilt from the pinned source at the
# locked recipe with the canonical hashes asserted before use (kept
# for the build-only fallback manifest, which runs the parity leg;
# the matrix cells themselves run direct, since the async proofs
# provably cannot cross the proxy — parity DIRECT-ONLY issues
# 24/25 — so the socket legs pin scheduling instead of proxying).
#
# Jobs: static-gates (build-free wiring gates, strict C builds, an
# executed canary, driver negative controls) runs first and gates
# the toolchain and proxy-pair setup jobs; qualify needs all three
# setups and runs on the hosted ubuntu-latest label (4 vCPU: the
# N=8 fairness cells are oversubscribed, so they assert completion
# counts, not timing; the runner record keeps nproc), where a mode
# selection step probes the setup results and selects behavioral
# (the 25-cell matrix through the V4a driver shims, each cell with
# its log and a pass/fail receipt) or buildonly (the repaired V1
# manifest, as in V4a). A runner that cannot run the matrix still
# produces selected-mode evidence, never a silent skip, but a
# buildonly run FAILS the qualify job as "incomplete: behavioral
# prerequisites unmet": the fallback cannot satisfy qualification.
# The run is judged against the exact requested revision (the
# dispatch input, else github.sha): static-gates rejects anything
# but a full 40-hex SHA that equals the checked-out HEAD, and the
# receipt verifier takes that revision as its expected sha.
# report needs qualify and always runs: it renders the pass/fail
# matrix from the qualify evidence into the job summary and
# attaches the matrix artifact. External versions and hashes land
# in the per-job provenance artifacts; every job sets a timeout
# and uploads its evidence through an always-run step so partial
# failure artifacts survive a failing run.
#
# Pin policy (F-4): same as the CI workflow — every third-party action
# is pinned to a full commit SHA with the human-readable tag kept as a
# trailing comment on the same line; the pin gate covers this file from
# the CI static step, and check-qualification-wiring.py owns the lane
# contract (triggers, read-only posture, pinning, setup gating,
# timeouts, artifacts, job set, native label, matrix cells, mode
# selection with build-only fallback, static guards, and the
# cell-to-driver-to-probe leg wiring) with durable negative controls.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact commit SHA to qualify (default: the selected ref)"
        default: ""
        type: string
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.event_name }}-${{ inputs.revision || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Require an exact full-SHA revision
        env:
          REV: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REV" ] \
            || { echo "revision must be a full SHA: got '$REV', HEAD $(git rev-parse HEAD)"; exit 2; }
          echo "qualifying exact revision $REV"
      - name: Build-free qualification wiring gates
        run: |
          set -euo pipefail
          {
            python3 scripts/check-qualification-wiring.py
            python3 scripts/check-qualification-wiring.py --self-test
            python3 scripts/check-actions-pinned.py .github/workflows/ci.yml
            python3 scripts/check-actions-pinned.py .github/workflows/hpc.yml
            python3 scripts/check-actions-pinned.py .github/workflows/prop-nightly.yml
            python3 scripts/check-actions-pinned.py .github/workflows/qualification.yml
            python3 scripts/test-release-workflow.py
            python3 scripts/test-ownership-matrix-controls.py
            sh -n scripts/test-ownership-matrix.sh
            for d in scripts/test-sim-threaded.sh scripts/test-finalize-race.sh \
                scripts/test-c-mutexes.sh scripts/test-consumers.sh \
                scripts/test-async-attached.sh scripts/test-async-detached.sh \
                scripts/test-ossl4-bounds.sh; do
              sh -n "$d"
            done
            for p in tests/c/sim_threaded.c tests/c/finalize_race.c \
                tests/c/finalize_wait_race_probe.c tests/c/async_routed.c \
                tests/c/notifications_routed.c tests/c/mutexes.c \
                tests/c/consumer_multithread.c; do
              cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Ispec/vendor "$p"
            done
            # The 64-bit cell compiles every consumer scenario with
            # the width macro: prove that shape warning-clean here.
            for p in tests/c/consumer_*.c tests/c/message_routed.c \
                tests/c/async_routed.c tests/c/notifications_routed.c; do
              cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Ispec/vendor \
                -DHASKOKI_WIDTH_LEG=64 "$p"
            done
            # Executed canary (standalone C, no toolchain needed).
            cc -std=c11 -O2 -g -Wall -Wextra -Werror -Ispec/vendor \
              -o /tmp/qual-mutexes tests/c/mutexes.c -lpthread
            /tmp/qual-mutexes
            cc -std=c11 -O2 -g -Wall -Wextra -Werror -Ispec/vendor \
              -DHASKOKI_WIDTH_LEG=64 -o /tmp/qual-mutexes64 tests/c/mutexes.c -lpthread
            /tmp/qual-mutexes64
            # Driver negative controls: every bogus hint fails fast
            # before any build, so each must exit nonzero here.
            if HASKOKI_QUAL_ONLY=bogus sh scripts/test-consumers.sh >/dev/null 2>&1; then
              echo "negative control failed: bogus scenario hint passed"; exit 2
            fi
            if HASKOKI_WIDTH_LEG=bogus sh scripts/test-consumers.sh >/dev/null 2>&1; then
              echo "negative control failed: bogus width hint passed"; exit 2
            fi
            if HASKOKI_SOCKET_CPU=bogus sh scripts/test-sim-threaded.sh >/dev/null 2>&1; then
              echo "negative control failed: bogus pinning hint passed"; exit 2
            fi
            echo "negative controls hold: bogus hints fail fast"
          } 2>&1 | tee static-gates.log
          test -s static-gates.log || { echo "static gate log missing"; exit 2; }
      - name: Upload static gate log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-gates-log
          path: static-gates.log
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Toolchain image, built remotely from the checked-out SHA (the same
  # Dockerfile as CI bundle). Load-only: the image is saved to an
  # artifact for the qualify job, never published anywhere.
  # ------------------------------------------------------------------
  toolchain:
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (load for local use)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: haskoki-dev:ghc-9.10.3
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          {
          IMAGE_ID=$(docker inspect --format '{{.Id}}' haskoki-dev:ghc-9.10.3) \
            || { echo "cannot inspect builder image"; exit 2; }
          GHC_V=$(docker run --rm haskoki-dev:ghc-9.10.3 ghc --numeric-version) \
            || { echo "cannot read GHC version"; exit 2; }
          CABAL_V=$(docker run --rm haskoki-dev:ghc-9.10.3 cabal --numeric-version) \
            || { echo "cannot read cabal version"; exit 2; }
          GCC_V=$(docker run --rm haskoki-dev:ghc-9.10.3 sh -c 'gcc -dumpversion') \
            || { echo "cannot read gcc version"; exit 2; }
          GLIBC_V=$(docker run --rm haskoki-dev:ghc-9.10.3 sh -c 'ldd --version | head -1') \
            || { echo "cannot read glibc version"; exit 2; }
          OSSL_V=$(docker run --rm haskoki-dev:ghc-9.10.3 /opt/openssl-4.0.2/bin/openssl version) \
            || { echo "cannot read OpenSSL version"; exit 2; }
          # BuildKit resolves FROM sources into its cache without
          # guaranteeing image-store tags; pull explicitly so the
          # digest recording below sees a named tag on a fresh
          # runner (CI demo-image-build precedent).
          docker pull ubuntu:26.04
          BASE_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04)
          case "$BASE_DIGEST" in
            ""|"<no value>") echo "base digest unreadable"; exit 2 ;;
          esac
          echo "base: $BASE_DIGEST"
          python3 - "$IMAGE_ID" "$GHC_V" "$CABAL_V" "$GCC_V" "$GLIBC_V" "$OSSL_V" "$BASE_DIGEST" \
            > toolchain-provenance.json <<'PY' || { echo "provenance record failed"; exit 2; }
          import json, sys
          print(json.dumps({
            "builder_image": "haskoki-dev:ghc-9.10.3",
            "builder_image_id": sys.argv[1],
            "ghc": sys.argv[2],
            "cabal_install": sys.argv[3],
            "gcc": sys.argv[4],
            "builder_glibc": sys.argv[5],
            "openssl": sys.argv[6],
            "base_digest": sys.argv[7],
            "source": "qualification lane toolchain job",
          }, indent=2))
          PY
          python3 -m json.tool toolchain-provenance.json > /dev/null \
            || { echo "provenance is not valid JSON"; exit 2; }
          cat toolchain-provenance.json
          } 2>&1 | tee toolchain-setup.log
      - name: Save image for the qualify job
        run: |
          set -euo pipefail
          {
          docker save haskoki-dev:ghc-9.10.3 | gzip > toolchain-image.tar.gz
          test -s toolchain-image.tar.gz || { echo "image archive empty"; exit 2; }
          ls -la toolchain-image.tar.gz
          } 2>&1 | tee -a toolchain-setup.log
      - name: Record toolchain setup status
        if: always()
        run: |
          set -uo pipefail
          IMAGE_ID=missing
          IMAGE_ID=$(docker inspect --format '{{.Id}}' haskoki-dev:ghc-9.10.3 2>/dev/null) || IMAGE_ID=missing
          ARCHIVE_PRESENT=no
          [ -s toolchain-image.tar.gz ] && ARCHIVE_PRESENT=yes
          python3 - "$IMAGE_ID" "$ARCHIVE_PRESENT" > toolchain-status.json <<'PY' || true
          import json, sys
          print(json.dumps({
            "builder_image_id": sys.argv[1],
            "archive_present": sys.argv[2],
          }, indent=2))
          PY
          cat toolchain-status.json 2>/dev/null || echo "toolchain setup produced no status"
          exit 0
      - name: Upload toolchain bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-toolchain
          path: |
            toolchain-image.tar.gz
            toolchain-provenance.json
            toolchain-status.json
            toolchain-setup.log
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Proxy pair, rebuilt from the pinned source at the locked recipe
  # (test-proxy-parity.sh header + Dockerfile.demo proxy stage are the
  # canonical hash authority). Any hash mismatch fails the lane here,
  # before the qualify job can run parity against a wrong pair.
  # ------------------------------------------------------------------
  proxy-pair:
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Rebuild the proxy pair from the pinned source and locked recipe
        run: |
          set -euo pipefail
          {
          PROXY_COMMIT=1ed7cc15c838de2e56ba03ac34f426847ffce049
          PROXY_LOCK=5452b6bd6ab47d72e8172a04a8f8a72460dabc17f66ced110b930f6d5d75b7d3
          PROXY_DAEMON=91d9ccba8e579891fb5a8815f66518baef0a757bd9a2563097983ca9d056385b
          PROXY_SHIM=87eb3f651c82de637e30666f305fae540375680bc754cf76249e17b6e7cb1d75
          rm -rf proxy-src proxy-pair
          git clone --no-checkout https://github.com/mingulov/pkcs11-proxy-ng proxy-src
          (cd proxy-src && git checkout --quiet "$PROXY_COMMIT")
          HEAD=$(cd proxy-src && git rev-parse HEAD)
          [ "$HEAD" = "$PROXY_COMMIT" ] || { echo "proxy checkout mismatch: $HEAD"; exit 2; }
          (cd proxy-src && echo "$PROXY_LOCK  Cargo.lock" | sha256sum -c -)
          docker pull rust:1.94-bookworm
          RUST_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' rust:1.94-bookworm)
          case "$RUST_DIGEST" in
            ""|"<no value>") echo "rust digest unreadable"; exit 2 ;;
          esac
          echo "rust base: $RUST_DIGEST"
          timeout -s KILL 2400 docker run --rm --network host \
            -v "$PWD/proxy-src:/src" -w /src rust:1.94-bookworm \
            bash -c 'apt-get update -qq && apt-get install -y -qq protobuf-compiler && cargo build --release --locked && rustc --version > /src/rustc-version.txt'
          RUSTC_V=$(cat proxy-src/rustc-version.txt)
          echo "effective rustc: $RUSTC_V"
          mkdir -p proxy-pair
          cp proxy-src/target/release/pkcs11-proxy-ng proxy-pair/
          cp proxy-src/target/release/libpkcs11_proxy_ng_shim.so proxy-pair/
          (cd proxy-pair && echo "$PROXY_DAEMON  pkcs11-proxy-ng" | sha256sum -c -)
          (cd proxy-pair && echo "$PROXY_SHIM  libpkcs11_proxy_ng_shim.so" | sha256sum -c -)
          # Artifact upload/download normalizes modes to 0644, which
          # would strip +x from the daemon and fail the qualify-time
          # executable check: ship a tarball (modes live in tar
          # headers; CI bundle-job precedent).
          rm -f proxy-pair.tar.gz
          tar -czf proxy-pair.tar.gz proxy-pair/
          tar tzf proxy-pair.tar.gz > /dev/null \
            || { echo "proxy archive validation failed"; exit 2; }
          ls -la proxy-pair.tar.gz
          python3 - "$PROXY_COMMIT" "$PROXY_LOCK" "$PROXY_DAEMON" "$PROXY_SHIM" "$RUSTC_V" "$RUST_DIGEST" \
            > proxy-provenance.json <<'PY' || { echo "provenance record failed"; exit 2; }
          import json, sys
          print(json.dumps({
            "proxy_source": "https://github.com/mingulov/pkcs11-proxy-ng",
            "proxy_commit": sys.argv[1],
            "cargo_lock_sha256": sys.argv[2],
            "daemon_sha256": sys.argv[3],
            "shim_sha256": sys.argv[4],
            "rustc": sys.argv[5],
            "rust_base_digest": sys.argv[6],
          }, indent=2))
          PY
          python3 -m json.tool proxy-provenance.json > /dev/null \
            || { echo "provenance is not valid JSON"; exit 2; }
          cat proxy-provenance.json
          } 2>&1 | tee proxy-setup.log
      - name: Record proxy setup status
        if: always()
        run: |
          set -uo pipefail
          DAEMON_PRESENT=no
          SHIM_PRESENT=no
          [ -x proxy-pair/pkcs11-proxy-ng ] && DAEMON_PRESENT=yes
          [ -f proxy-pair/libpkcs11_proxy_ng_shim.so ] && SHIM_PRESENT=yes
          python3 - "$DAEMON_PRESENT" "$SHIM_PRESENT" > proxy-status.json <<'PY' || true
          import json, sys
          print(json.dumps({
            "daemon_present": sys.argv[1],
            "shim_present": sys.argv[2],
          }, indent=2))
          PY
          cat proxy-status.json 2>/dev/null || echo "proxy setup produced no status"
          exit 0
      - name: Upload proxy pair
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-proxy
          path: |
            proxy-pair.tar.gz
            proxy-provenance.json
            proxy-status.json
            proxy-setup.log
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Qualify: probe the setup bundles without failing, select the
  # execution mode from the probe, then run the behavioral matrix
  # (native docker legs through the V4a driver shims, one receipt
  # per cell) or the build-only V1 manifest fallback. Collect-all:
  # every cell runs and the step fails closed on any cell failure,
  # while the always-run upload below preserves partial evidence.
  # Measured wall is dominated by the full-suite rows; one 6-hour
  # runner is the bound.
  # ------------------------------------------------------------------
  qualify:
    needs: [static-gates, toolchain, proxy-pair]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Download toolchain bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-toolchain
          path: toolchain-in/
      - name: Download proxy pair
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-proxy
          path: proxy-in/
      - name: Probe setup status
        run: |
          # Soft probe (this step never fails the job): record what
          # the mode selection below may use, so a native runner
          # that cannot run the matrix still gets a receipted mode.
          set -uo pipefail
          {
          DOCKER_OK=no
          IMAGE_OK=no
          PROXY_OK=no
          command -v docker >/dev/null 2>&1 && DOCKER_OK=yes
          if [ "$DOCKER_OK" = "yes" ] && [ -f toolchain-in/toolchain-image.tar.gz ]; then
            if gunzip -c toolchain-in/toolchain-image.tar.gz | docker load; then
              # The loaded image must be the very image the toolchain
              # job recorded (docker save/load preserves the id).
              LOADED_ID=$(docker inspect --format '{{.Id}}' haskoki-dev:ghc-9.10.3 2>/dev/null) || LOADED_ID=
              RECORDED_ID=$(python3 -c 'import json;print(json.load(open("toolchain-in/toolchain-provenance.json"))["builder_image_id"])' 2>/dev/null) || RECORDED_ID=
              if [ -n "$LOADED_ID" ] && [ "$LOADED_ID" = "$RECORDED_ID" ]; then
                IMAGE_OK=yes
              else
                echo "toolchain image id mismatch: loaded '$LOADED_ID' recorded '$RECORDED_ID'"
              fi
            fi
          fi
          if [ -f proxy-in/proxy-pair.tar.gz ] && tar xzf proxy-in/proxy-pair.tar.gz -C proxy-in; then
            if [ -x proxy-in/proxy-pair/pkcs11-proxy-ng ] \
                && [ -f proxy-in/proxy-pair/libpkcs11_proxy_ng_shim.so ] \
                && (cd proxy-in/proxy-pair \
                  && echo "91d9ccba8e579891fb5a8815f66518baef0a757bd9a2563097983ca9d056385b  pkcs11-proxy-ng" | sha256sum -c -) >/dev/null 2>&1 \
                && (cd proxy-in/proxy-pair \
                  && echo "87eb3f651c82de637e30666f305fae540375680bc754cf76249e17b6e7cb1d75  libpkcs11_proxy_ng_shim.so" | sha256sum -c -) >/dev/null 2>&1; then
              PROXY_OK=yes
            fi
          fi
          python3 - "$DOCKER_OK" "$IMAGE_OK" "$PROXY_OK" > setup-status.json <<'PY' || true
          import json, sys
          print(json.dumps({
            "docker": sys.argv[1],
            "image": sys.argv[2],
            "proxy": sys.argv[3],
          }, indent=2))
          PY
          cat setup-status.json 2>/dev/null || echo "setup probe produced no status"
          } 2>&1 | tee setup-probe.log
          exit 0
      - name: Select execution mode
        id: select
        run: |
          set -euo pipefail
          {
          MODE=buildonly
          REASON="behavioral prerequisites unmet (see setup-status.json)"
          DOCKER_OK=no
          IMAGE_OK=no
          if [ -f setup-status.json ]; then
            DOCKER_OK=$(python3 -c 'import json;print(json.load(open("setup-status.json"))["docker"])')
            IMAGE_OK=$(python3 -c 'import json;print(json.load(open("setup-status.json"))["image"])')
          fi
          # The matrix cells run direct through the toolchain image
          # (the proxy pair serves only the fallback manifest parity
          # leg), so docker plus the loaded image selects behavioral.
          if [ "$DOCKER_OK" = "yes" ] && [ "$IMAGE_OK" = "yes" ]; then
            MODE=behavioral
            REASON="docker present and image loaded"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          python3 - "$MODE" "$REASON" > classification.json <<'PY' || { echo "mode receipt failed"; exit 2; }
          import json, sys
          print(json.dumps({"mode": sys.argv[1], "reason": sys.argv[2]}, indent=2))
          PY
          cat classification.json
          } 2>&1 | tee mode-select.log
      - name: Align checkout ownership with image user
        run: |
          # The image runs as uid:gid 1000:1000 but the runner owns the
          # checkout as 1001, so the bind-mounted /work would be
          # read-only and cabal could not create dist-newstyle (CI
          # bundle-job precedent; the manifest itself never chowns).
          # The host demo leg also writes into the checkout
          # (staged-bundle beside the evidence redirect), and the host
          # runner is a different UID than the image user, so the
          # checkout stays world-writable: the image user keeps
          # ownership for the bind-mounted container legs while the
          # host keeps write access for the demo leg.
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
      - name: Run behavioral matrix
        if: steps.select.outputs.mode == 'behavioral'
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          {
          export HASKOKI_IMAGE=haskoki-dev:ghc-9.10.3
          export HASKOKI_EVIDENCE_DIR="$RUNNER_TEMP/qualify-evidence"
          mkdir -p "$HASKOKI_EVIDENCE_DIR/cells"
          # One row per cell: name|driver|env assignments (an empty
          # env runs the driver default). Tuned legs filter to their
          # scenario; the two full-suite rows pin the default
          # baseline and the explicit-64 compile of every scenario.
          cat > cells.txt <<'EOF'
          consumers/default|test-consumers.sh|
          consumers/width-64|test-consumers.sh|HASKOKI_WIDTH_LEG=64
          pin-rotate|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_PIN_ROTATE=1
          aging|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_AGING=1
          async-reroute|test-consumers.sh|HASKOKI_QUAL_ONLY=async_routed HASKOKI_ASYNC_REROUTE=1
          async-parallel-seed|test-consumers.sh|HASKOKI_QUAL_ONLY=async_routed HASKOKI_ASYNC_PARALLEL_SEED=8
          serial-fairness|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=1 HASKOKI_MT_FAIR=1
          fairness-1-app|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=1 HASKOKI_MT_MUTEX=1 HASKOKI_MT_FAIR=1
          fairness-2-null|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=2 HASKOKI_MT_FAIR=1
          fairness-2-app|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=2 HASKOKI_MT_MUTEX=1 HASKOKI_MT_FAIR=1
          fairness-4-null|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=4 HASKOKI_MT_FAIR=1
          mutex-fairness|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=4 HASKOKI_MT_MUTEX=1 HASKOKI_MT_FAIR=1
          fairness-8-null|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=8 HASKOKI_MT_FAIR=1
          fairness-8-app|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_N=8 HASKOKI_MT_MUTEX=1 HASKOKI_MT_FAIR=1
          hint-strictness|test-consumers.sh|HASKOKI_QUAL_ONLY=consumer_multithread HASKOKI_MT_HINT_STRICT=1
          sim/default|test-sim-threaded.sh|
          thread-reuse|test-sim-threaded.sh|HASKOKI_SIM_WAVES=3 HASKOKI_SIM_ITERS=5000 HASKOKI_SIM_M=20
          socket-quiet|test-sim-threaded.sh|HASKOKI_SOCKET_CPU=0
          finalize/default|test-finalize-race.sh|
          finalize-wait|test-finalize-race.sh|HASKOKI_FINALIZE_WAIT_CYCLES=200
          mutexes/default|test-c-mutexes.sh|
          async-attached/default|test-async-attached.sh|
          async-detached/default|test-async-detached.sh|
          async-socket|test-async-detached.sh|HASKOKI_SOCKET_CPU=0
          ossl4/default|test-ossl4-bounds.sh|
          EOF
          : > cell-results.txt
          : > cell-meta.txt
          FAILURES=""
          # Read from the file (never a pipeline) so the failure
          # accumulator survives the loop; collect-all with a
          # fail-closed exit, mirroring the consumer driver.
          while IFS='|' read -r cell driver assignments; do
            [ -n "$cell" ] || continue
            safe=$(printf '%s' "$cell" | tr '/' '_')
            log="$HASKOKI_EVIDENCE_DIR/cells/$safe.log"
            echo "=== cell: $cell ($driver${assignments:+ }$assignments)"
            # Selectors cross into the container as explicit --env
            # flags: environment set on the docker client never
            # reaches the container on its own.
            ENV_ARGS=""
            # shellcheck disable=SC2086
            for assign in $assignments; do
              ENV_ARGS="$ENV_ARGS --env $assign"
            done
            started=$(date +%s)
            rc=0
            # shellcheck disable=SC2086
            docker run --rm $ENV_ARGS -v "$PWD:/work" -w /work \
                "$HASKOKI_IMAGE" "scripts/$driver" >"$log" 2>&1 || rc=$?
            echo "$cell|$rc|$(( $(date +%s) - started ))" >> cell-meta.txt
            if [ "$rc" -eq 0 ]; then
              echo "$cell pass" >> cell-results.txt
              echo "cell $cell: pass"
            else
              echo "$cell FAIL" >> cell-results.txt
              echo "cell $cell: FAIL rc=$rc (see cells/$safe.log)"
              FAILURES="$FAILURES $cell"
            fi
          done < cells.txt
          # Receipt identity: the commit actually checked out, the
          # revision that was requested, and the runner/image that
          # executed the cells.
          export RECEIPT_SHA="$(git rev-parse HEAD)"
          export RECEIPT_REQUESTED="$REQUESTED_REVISION"
          export RECEIPT_OS="$(uname -sr) $(uname -m) ${ImageOS:-unknown}/${ImageVersion:-unknown}"
          export RECEIPT_NPROC="$(nproc)"
          export RECEIPT_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$HASKOKI_IMAGE")"
          python3 - cells.txt cell-results.txt cell-meta.txt \
            > "$HASKOKI_EVIDENCE_DIR/matrix.json" <<'PY' || { echo "matrix receipt failed"; exit 2; }
          import json, os, sys
          # Lists, never dicts keyed by name: a duplicated row or
          # result line must stay visible to the receipt verifier.
          rows, results, meta = [], [], {}
          for line in open(sys.argv[1]):
              line = line.strip()
              if line:
                  name, driver, env = line.split("|")
                  rows.append((name, driver, env))
          for line in open(sys.argv[2]):
              line = line.strip()
              if line:
                  name, result = line.rsplit(" ", 1)
                  results.append((name, result))
          for line in open(sys.argv[3]):
              line = line.strip()
              if line:
                  name, rc, dur = line.split("|")
                  meta.setdefault(name, []).append((int(rc), int(dur)))
          cells, failures = [], []
          for name, driver, env in rows:
              matched = [r for n, r in results if n == name]
              result = matched[0] if len(matched) == 1 else (
                  "missing" if not matched else "duplicate")
              rc, dur = (meta.get(name) or [(None, None)])[0]
              cells.append({"name": name, "driver": driver, "env": env,
                            "result": result, "rc": rc, "duration_s": dur})
              if result != "pass":
                  failures.append(name)
          print(json.dumps({
              "mode": "behavioral",
              "sha": os.environ["RECEIPT_SHA"],
              "requested_revision": os.environ["RECEIPT_REQUESTED"],
              "runner": {"os": os.environ["RECEIPT_OS"],
                         "nproc": int(os.environ["RECEIPT_NPROC"]),
                         "image_id": os.environ["RECEIPT_IMAGE_ID"]},
              "cells": cells, "failures": failures}, indent=2))
          PY
          cat "$HASKOKI_EVIDENCE_DIR/matrix.json"
          [ -z "$FAILURES" ] || { echo "matrix failures:$FAILURES"; exit 1; }
          } 2>&1 | tee "$RUNNER_TEMP/qualify-evidence-run.log"
      - name: Run ownership matrix (private RTS)
        # Separate obligation from the 25-cell matrix and from the
        # 19-step manifest (scripts/driver-inventory.json role
        # qualification): one receipt per (case, RTS -N1/-N2/-N4)
        # under qualify-evidence/ownership. Runs even when the matrix
        # step failed so both verdicts are recorded; fails the job on
        # any failing or missing receipt.
        if: always() && steps.select.outputs.mode == 'behavioral'
        run: |
          set -euo pipefail
          export HASKOKI_IMAGE=haskoki-dev:ghc-9.10.3
          OWN_DIR="$RUNNER_TEMP/qualify-evidence/ownership"
          mkdir -p "$OWN_DIR"
          chmod a+rwx "$OWN_DIR"
          docker run --rm --network host -v "$PWD:/work" -w /work \
            -v "$OWN_DIR:/ownership" \
            --env HASKOKI_OWN_SHA="$(git rev-parse HEAD)" \
            --env HASKOKI_OWN_RECEIPTS=/ownership \
            "$HASKOKI_IMAGE" scripts/test-ownership-matrix.sh 2>&1 \
            | tee "$RUNNER_TEMP/qualify-evidence/ownership.log"
      - name: Run the build-only fallback manifest
        if: steps.select.outputs.mode == 'buildonly'
        run: |
          set -euo pipefail
          export HASKOKI_IMAGE=haskoki-dev:ghc-9.10.3
          export HASKOKI_PROXY_DIR="$GITHUB_WORKSPACE/proxy-in/proxy-pair"
          # Host-side manifest outputs live outside the checkout: the
          # manifest funnels its own host writes through
          # HASKOKI_EVIDENCE_DIR (per-driver logs, staged tarball,
          # MANIFEST.txt) and runs the demo leg under it. Beside that
          # redirect, the host demo leg still creates staged-bundle
          # inside the checkout, so the align step above hands the
          # checkout to the image user for the bind-mounted container
          # legs while keeping it writable for the host runner (a
          # different UID). Container legs keep writing
          # dist-newstyle/dist-release into the checkout.
          export HASKOKI_EVIDENCE_DIR="$RUNNER_TEMP/qualify-evidence"
          bash scripts/release-evidence.sh 2>&1 | tee "$RUNNER_TEMP/qualify-evidence-run.log"
          test -f "$HASKOKI_EVIDENCE_DIR/MANIFEST.txt" \
            || { echo "manifest receipt missing"; exit 2; }
      - name: Fail a build-only run as incomplete
        if: steps.select.outputs.mode == 'buildonly'
        run: |
          # The fallback manifest is evidence, not qualification: the
          # job fails while the always-run upload below still keeps it.
          echo "incomplete: behavioral prerequisites unmet (a build-only run cannot satisfy qualification)"
          exit 1  # buildonly-incomplete
      - name: Assemble matrix receipt
        if: always()
        run: |
          # Guarantee the matrix receipt and the run log exist for
          # the upload and the report job even when both execution
          # steps above were skipped, and stage every receipt under
          # the one evidence root: the upload below must see a
          # single directory tree, never a mix of runner-temp and
          # checkout paths (mixed roots nest unpredictably in the
          # archive and the report would read the wrong layout).
          set -uo pipefail
          MODE=unknown
          MODE=$(python3 -c 'import json;print(json.load(open("classification.json"))["mode"])' 2>/dev/null) || MODE=unknown
          mkdir -p "$RUNNER_TEMP/qualify-evidence"
          if [ ! -f "$RUNNER_TEMP/qualify-evidence/matrix.json" ]; then
            MANIFEST=no
            [ -f "$RUNNER_TEMP/qualify-evidence/MANIFEST.txt" ] && MANIFEST=yes
            python3 - "$MODE" "$MANIFEST" > "$RUNNER_TEMP/qualify-evidence/matrix.json" <<'PY' || true
          import json, sys
          print(json.dumps({"mode": sys.argv[1], "cells": [],
                            "failures": [], "fallback_manifest": sys.argv[2]}, indent=2))
          PY
          fi
          STAGE_FAIL=""
          for f in classification.json setup-status.json setup-probe.log mode-select.log; do
            if [ -f "$f" ]; then
              cp "$f" "$RUNNER_TEMP/qualify-evidence/" 2>/dev/null || STAGE_FAIL="$STAGE_FAIL $f"
            else
              STAGE_FAIL="$STAGE_FAIL $f(missing)"
            fi
          done
          # Cell table and per-cell results exist only when the
          # matrix step ran; stage them when present.
          for f in cells.txt cell-results.txt cell-meta.txt; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/qualify-evidence/" 2>/dev/null
          done || true
          echo "mode=$MODE" >> "$RUNNER_TEMP/qualify-evidence-run.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/qualify-evidence/matrix.json" 2>/dev/null \
            || echo "matrix receipt missing"
          [ -z "$STAGE_FAIL" ] || { echo "receipt staging failed:$STAGE_FAIL"; exit 2; }
          exit 0
      - name: Restore checkout ownership to runner
        if: always()
        run: |
          # The align step handed the checkout to the image user
          # (1000:1000) for the bind-mounted manifest; hand it back so
          # the host-side evidence upload below sees readable files.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-evidence
          path: |
            ${{ runner.temp }}/qualify-evidence/
            ${{ runner.temp }}/qualify-evidence-run.log
          if-no-files-found: error
      - name: Verify matrix receipt
        if: always()
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          # Last qualify step: judge the receipt after it is uploaded.
          # Exact 25-cell set, behavioral mode, 25/25 pass and the
          # requested sha; a build-only fallback fails here.
          set -euo pipefail
          python3 scripts/check-qualification-wiring.py --verify-matrix \
            "$RUNNER_TEMP/qualify-evidence" --expect-sha "$REQUESTED_REVISION"

  # ------------------------------------------------------------------
  # Report: render the pass/fail matrix from the qualify evidence
  # into the job summary and attach the matrix artifact. Always
  # runs, so a failed matrix still renders; only missing or
  # unparseable evidence fails this job (qualify owns the matrix
  # verdict itself).
  # ------------------------------------------------------------------
  report:
    needs: qualify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Download qualification evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-evidence
          path: evidence-in/
      - name: Render pass/fail matrix
        if: always()
        run: |
          set -uo pipefail
          python3 - > MATRIX.md <<'PY' || { echo "matrix render failed"; exit 2; }
          import json, os, sys
          try:
              with open("evidence-in/qualify-evidence/matrix.json") as handle:
                  matrix = json.load(handle)
          except (OSError, ValueError) as exc:
              print(f"MISSING matrix receipt: {exc}")
              sys.exit(2)
          try:
              with open("evidence-in/qualify-evidence/classification.json") as handle:
                  mode = json.load(handle).get("mode", matrix.get("mode", "unknown"))
          except (OSError, ValueError):
              mode = matrix.get("mode", "unknown")
          cells = matrix.get("cells", [])
          passes = sum(1 for cell in cells if cell.get("result") == "pass")
          fails = [cell.get("name", "?") for cell in cells if cell.get("result") != "pass"]
          lines = ["# Qualification matrix", "", f"mode: {mode}",
                   f"cells: {len(cells)} pass: {passes} fail: {len(fails)}", ""]
          if cells:
              lines += ["| cell | driver | result |", "| --- | --- | --- |"]
              for cell in cells:
                  lines.append(f"| {cell.get('name', '?')} | {cell.get('driver', '?')} "
                               f"| {cell.get('result', '?')} |")
              lines.append("")
          else:
              lines += [f"fallback manifest: {matrix.get('fallback_manifest', 'unknown')}", ""]
          if fails:
              lines += ["failures: " + ", ".join(fails), ""]
          text = "\n".join(lines)
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as handle:
                  handle.write(text + "\n")
          PY
          cat MATRIX.md
          exit 0
      - name: Verify matrix receipt
        if: always()
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          # The report job exits nonzero when the receipt is missing,
          # partial, duplicated, non-behavioral, failing or for a
          # different sha than the requested revision.
          set -euo pipefail
          python3 scripts/check-qualification-wiring.py --verify-matrix \
            evidence-in/qualify-evidence --expect-sha "$REQUESTED_REVISION"
      - name: Upload matrix artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-matrix
          path: MATRIX.md
          if-no-files-found: error
