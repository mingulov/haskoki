name: CI and Release

# Default toolchain (GHC 9.10.3) + bundle build + external
# pkcs11-check conformance, both lanes on every push/PR:
#   fast  offline markers, no vector data (quick conformance signal)
#   kat   full markers over fetched vector data (fetch-data, cached)
# pkcs11-check findings are REPORTED, not gating (exit 1 passes the
# lane): the module is a demonstrator whose honest refusals the
# oracle records as findings. Exit >= 2 (setup error) fails loudly.
# The framework pins to v0.2.1; build-mode dispatch can override it.
#
# CD: Actions -> Run workflow -> main, mode=release, version=X.Y.Z.W.
# Publishing also accepts owner-pushed v* tags. Both routes use the
# SAME run's tested artifacts; a GITHUB_TOKEN tag push need not trigger CI.
# Publishing happens ONLY in `publish`. It needs
# passing build+tests+c-drivers+bundle+fast-lane+demo-image, verifies
# the tag matches the Cabal version, then pushes the DEMO image to GHCR and
# attaches the release bundle to a NEW GitHub release (never
# replacement assets: no --clobber anywhere).
# The KAT lane stays informational (too slow to gate a release).
# Setup and recovery: docs/publishing.md.
#
# Pin policy (F-4): every third-party action is pinned to a full
# commit SHA, the human-readable tag kept as a trailing `# vX`
# comment on the same line (checkout v7.0.1, cache v6.1.0,
# buildx v4.4.1, build-push v7.4.0, login v4.6.0,
# upload-artifact v7.0.2, download-artifact v8.0.2, setup-uv
# v10.2.0, attest-build-provenance v4.2.2); Dependabot
# (`.github/dependabot.yml`) proposes SHA bumps,
# and `scripts/check-actions-pinned.py` fails any `uses:` that
# drifts back to a mutable tag. Floating inputs, visible here with
# reasons: `ubuntu-latest` runners (GitHub-managed, unpinnable by
# design); `ubuntu:26.04` and `rust:1.94-bookworm` image tags
# (floating tags; the effective digests are recorded per build in
# the job output/evidence) — base-image/APT/cache pinning deferred
# (F-4 defers P-15).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build artifacts only, or publish a release from main"
        default: build
        required: true
        type: choice
        options:
          - build
          - release
      version:
        description: "Release only: exact Cabal version, e.g. 0.3.0.0 (no v)"
        default: ""
        type: string
      framework_ref:
        description: "mingulov/pkcs11-check ref (tag/branch/sha)"
        default: "v0.2.1"
        type: string

permissions:
  contents: read

concurrency:
  # All publications share a group; ordinary main CI has a different group.
  group: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.mode == 'release') && 'haskoki-publication' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}

env:
  # One canonical data location shared by the fetch job (cache save)
  # and the kat lane (cache restore).
  PKCS11_CHECK_DATA_DIR: ${{ github.workspace }}/data
  # Releases retain the qualified fast-lane pin; overrides are build-only.
  FRAMEWORK_REF: ${{ inputs.mode == 'release' && 'v0.2.1' || github.event.inputs.framework_ref || 'v0.2.1' }}
  RELEASE_MODE: ${{ inputs.mode || 'build' }}
  RELEASE_VERSION: ${{ inputs.version || '' }}
  # Structural tests read UTF-8 sources with locale-dependent
  # decoders (Dockerfile precedent: the builder image sets the same
  # pair); the bare ubuntu:26.04 container defaults to C.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  release-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate release request (build mode has no release calls)
        id: request
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HASKOKI_RELEASE_SIGNING_KEY: ${{ secrets.HASKOKI_RELEASE_SIGNING_KEY }}
        run: python3 scripts/release-request.py preflight
      - name: Build mode requires no release credentials
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.mode == 'release')"
        run: python3 scripts/release-request.py preflight
      - name: Prove unattended signing when a key is provisioned
        if: steps.request.outputs.tag != ''
        env:
          HASKOKI_RELEASE_SIGNING_KEY: ${{ secrets.HASKOKI_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HASKOKI_RELEASE_SIGNING_KEY:-}" ]; then
            echo "no HASKOKI_RELEASE_SIGNING_KEY secret: release will ship unsigned"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/release-preflight-gpg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$HASKOKI_RELEASE_SIGNING_KEY" | gpg --batch --no-tty --import
          FPR=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          [ -n "$FPR" ] || { echo "release signing secret contains no private key"; exit 2; }
          printf 'Haskoki signing preflight\n' > "$RUNNER_TEMP/signing-check"
          gpg --batch --no-tty --pinentry-mode loopback --passphrase '' \
            --local-user "$FPR" --detach-sign --output "$RUNNER_TEMP/signing-check.sig" \
            "$RUNNER_TEMP/signing-check"
          gpg --batch --verify "$RUNNER_TEMP/signing-check.sig" "$RUNNER_TEMP/signing-check"
  # ------------------------------------------------------------------
  # Native build + full test suite + static gates in an Ubuntu 26.04
  # container (OS GHC 9.10.3, same base as the Dockerfile).
  # ------------------------------------------------------------------
  haskell:
    needs: release-request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ubuntu:26.04
    env:
      # Keep the cabal store on the mounted workspace so the cache
      # action (host-side) can persist it across runs.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Base packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ghc cabal-install libgmp-dev git perl curl \
            ca-certificates python3
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Restore OpenSSL prefix cache
        id: ossl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ossl-cache/openssl-4.0.2.tar.gz
          key: openssl-4.0.2-static-v1
      - name: Build OpenSSL prefix (cache miss only)
        if: steps.ossl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/ossl-build ossl-cache
          cd /tmp/ossl-build
          OSSL_URL=https://github.com/openssl/openssl/releases/download
          curl -fsSLO "$OSSL_URL/openssl-4.0.2/openssl-4.0.2.tar.gz"
          OSSL_SHA=736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8
          echo "$OSSL_SHA  openssl-4.0.2.tar.gz" | sha256sum -c -
          tar xzf openssl-4.0.2.tar.gz
          cd openssl-4.0.2
          perl ./Configure --prefix=/opt/openssl-4.0.2 --openssldir=/opt/openssl-4.0.2/ssl \
            --libdir=lib no-docs no-tests threads no-shared no-pinshared linux-x86_64
          make -j"$(nproc)"
          make install_sw
          /opt/openssl-4.0.2/bin/openssl version
          tar czf "$GITHUB_WORKSPACE/ossl-cache/openssl-4.0.2.tar.gz" -C / opt/openssl-4.0.2
      - name: Install cached OpenSSL prefix
        if: steps.ossl-cache.outputs.cache-hit == 'true'
        run: tar xzf ossl-cache/openssl-4.0.2.tar.gz -C /
      - name: Restore cabal store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cabal
          key: cabal-store-9.10.3-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            cabal-store-9.10.3-
      - name: Static gates (build-free)
        run: |
          set -euo pipefail
          for g in check-core-boundary check-mechanisms check-denominators \
              check-attributes check-ossl4-surface check-version check-ckr \
              check-seed-honesty check-warnings-zero check-docs \
              check-fork-stance check-test-wiring check-test-evidence check-coverage-boundary \
              check-release-pivots check-loader-norm check-release-install-flags \
              check-smoke-surface check-history-codes check-actions-pinned; do
            python3 scripts/$g.py
          done
          # Final-review M-1: the pin gate defaults to ci.yml — cover
          # every workflow so later lanes cannot drift to a mutable tag.
          python3 scripts/check-actions-pinned.py .github/workflows/hpc.yml
          python3 scripts/check-actions-pinned.py .github/workflows/prop-nightly.yml
          # F-4..F-8 fix-round regression: evasive-form negative
          # controls + F-6/F-7 structural asserts (durable, stdlib-only).
          python3 scripts/check-actions-pinned.py --self-test
          python3 scripts/check-test-evidence.py --self-test
          python3 scripts/test-release-request.py
          python3 scripts/test-release-workflow.py
          python3 scripts/test-demo-shards.py
          python3 scripts/publish-coverage.py --check
      - name: Build and test
        run: |
          set -euo pipefail
          cabal update
          cabal build all --enable-tests
          cabal test all 2>&1 | tee haskell-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haskell-test-log
          path: haskell-test.log
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Per-PR C-driver gate (F-7 / TEST1): the timed deterministic subset
  # of the 15 container drivers, on every push/PR, in an Ubuntu 26.04
  # container (same base + OpenSSL prefix + cabal cache shape as the
  # `haskell` job). Subset in run order:
  #   test-loader.sh, test-c-abi.sh (+ --negative, T-1),
  #   test-c-output.sh, test-c-mutexes.sh, test-consumers.sh,
  #   test-client.sh, test-ossl4-bounds.sh
  # (test-consumers.sh picks up every tests/c/consumer_*.c via its
  # glob, including consumer_so_isolation.c.) Race/threaded drivers
  # (test-finalize-race.sh, test-sim-threaded.sh,
  # test-async-attached.sh, test-async-detached.sh,
  # test-control-events.sh, test-lifecycle.sh, test-crypto-routed.sh,
  # test-proxy-parity.sh) stay on the release/nightly path only (the
  # release-evidence manifest via run-gates.sh); the split is also
  # recorded in the run-gates.sh header. Each driver step is timed and
  # tee'd to a per-driver log, uploaded as an artifact.
  # ------------------------------------------------------------------
  c-drivers:
    needs: release-request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ubuntu:26.04
    env:
      # Same mounted-store shape as `haskell` so the host-side cache
      # action can persist the cabal store across runs.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Base packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ghc cabal-install libgmp-dev git perl curl \
            ca-certificates python3
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Restore OpenSSL prefix cache
        id: ossl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ossl-cache/openssl-4.0.2.tar.gz
          key: openssl-4.0.2-static-v1
      - name: Build OpenSSL prefix (cache miss only)
        if: steps.ossl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/ossl-build ossl-cache
          cd /tmp/ossl-build
          OSSL_URL=https://github.com/openssl/openssl/releases/download
          curl -fsSLO "$OSSL_URL/openssl-4.0.2/openssl-4.0.2.tar.gz"
          OSSL_SHA=736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8
          echo "$OSSL_SHA  openssl-4.0.2.tar.gz" | sha256sum -c -
          tar xzf openssl-4.0.2.tar.gz
          cd openssl-4.0.2
          perl ./Configure --prefix=/opt/openssl-4.0.2 --openssldir=/opt/openssl-4.0.2/ssl \
            --libdir=lib no-docs no-tests threads no-shared no-pinshared linux-x86_64
          make -j"$(nproc)"
          make install_sw
          /opt/openssl-4.0.2/bin/openssl version
          tar czf "$GITHUB_WORKSPACE/ossl-cache/openssl-4.0.2.tar.gz" -C / opt/openssl-4.0.2
      - name: Install cached OpenSSL prefix
        if: steps.ossl-cache.outputs.cache-hit == 'true'
        run: tar xzf ossl-cache/openssl-4.0.2.tar.gz -C /
      - name: Restore cabal store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cabal
          key: cabal-store-9.10.3-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            cabal-store-9.10.3-
      - name: Build all
        run: |
          set -euo pipefail
          cabal update
          cabal build all --enable-tests
      - name: PR driver subset (timed, deterministic)
        # Container steps default to sh/dash, where `time` is not a
        # keyword and GNU time is not installed (exit 127 before any
        # driver runs): select bash, like the file's other timed step
        # (demo-image, runner bash).
        shell: bash
        run: |
          set -euo pipefail
          for d in test-loader.sh test-c-abi.sh test-c-output.sh \
              test-c-mutexes.sh test-consumers.sh test-client.sh \
              test-ossl4-bounds.sh; do
            echo "=== driver: $d ==="
            time sh "scripts/$d" 2>&1 | tee "c-drivers-$d.log"
          done
          echo "=== sensitivity control: test-c-abi.sh --negative ==="
          time sh scripts/test-c-abi.sh --negative 2>&1 | tee c-drivers-test-c-abi-negative.log
      - name: Upload driver logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-drivers-logs
          path: c-drivers-*.log
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Toolchain image + release artifact + bare-host install test.
  # Build-only: runs everywhere the lanes need the bundle artifact.
  # Nothing here publishes; see `publish`.
  # ------------------------------------------------------------------
  bundle:
    needs: release-request
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (load for local use)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: haskoki-dev:ghc-9.10.3
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Align checkout ownership with image user
        run: |
          # The image runs as uid:gid 1000:1000 but the runner owns the
          # checkout as 1001, so the bind-mounted /work would be
          # read-only and cabal could not create dist-newstyle.
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      - name: Build release artifact
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            haskoki-dev:ghc-9.10.3 scripts/make-release.sh
      - name: Install test on bare image
        run: |
          set -euo pipefail
          # Leg B needs the packaged-asset tarball layout, which only
          # exists after publish-time packaging: stage an unsigned
          # layout-identical tarball in /tmp (packager precedent:
          # top-level member haskoki-$VER) and pass it explicitly, so
          # the staged dist-release/ tree stays clean.
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          [ -n "$VER" ] || { echo "cannot parse version"; exit 2; }
          rm -rf /tmp/legb-stage && mkdir -p /tmp/legb-stage
          (cd dist-release && tar -czf "/tmp/legb-stage/haskoki-$VER-linux-x86_64.tar.gz" "haskoki-$VER") \
            || { echo "leg-B tarball staging failed"; exit 2; }
          bash scripts/test-release-install.sh \
            "dist-release/haskoki-$VER" ubuntu:26.04 \
            "/tmp/legb-stage/haskoki-$VER-linux-x86_64.tar.gz"
      - name: Build sdist and verify outside the checkout
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$PWD:/work" -w /work \
            haskoki-dev:ghc-9.10.3 sh -c 'cabal sdist'
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          rm -rf /tmp/sdist-verify && mkdir -p /tmp/sdist-verify
          tar xzf "dist-newstyle/sdist/haskoki-$VER.tar.gz" -C /tmp/sdist-verify
          printf 'packages: .\nallow-newer: all\n' \
            > "/tmp/sdist-verify/haskoki-$VER/cabal.project"
          sudo chown -R 1000:1000 /tmp/sdist-verify
          docker run --rm --network host -v "/tmp/sdist-verify/haskoki-$VER:/src" \
            -w /src haskoki-dev:ghc-9.10.3 \
            sh -c 'cabal build all --enable-tests && cabal test all'
      - name: Restore checkout ownership to runner
        run: |
          # The align step handed the checkout to the image user
          # (1000:1000) for the bind-mounted docker steps; hand it
          # back so host-side writes (provenance, tarball) and the
          # artifact upload work again.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Capture producer provenance
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker inspect --format '{{.Id}}' haskoki-dev:ghc-9.10.3) \
            || { echo "cannot inspect builder image"; exit 2; }
          GHC_V=$(docker run --rm haskoki-dev:ghc-9.10.3 ghc --numeric-version) \
            || { echo "cannot read GHC version"; exit 2; }
          CABAL_V=$(docker run --rm haskoki-dev:ghc-9.10.3 cabal --numeric-version) \
            || { echo "cannot read cabal version"; exit 2; }
          GCC_V=$(docker run --rm haskoki-dev:ghc-9.10.3 sh -c 'gcc -dumpversion') \
            || { echo "cannot read gcc version"; exit 2; }
          GLIBC_V=$(docker run --rm haskoki-dev:ghc-9.10.3 sh -c 'ldd --version | head -1') \
            || { echo "cannot read glibc version"; exit 2; }
          python3 - "$IMAGE_ID" "$GHC_V" "$CABAL_V" "$GCC_V" "$GLIBC_V" \
            > producer-provenance.json <<'PY' || { echo "provenance write failed"; exit 2; }
          import json, sys
          print(json.dumps({
            "builder_image": "haskoki-dev:ghc-9.10.3",
            "builder_image_id": sys.argv[1],
            "ghc": sys.argv[2],
            "cabal_install": sys.argv[3],
            "gcc": sys.argv[4],
            "builder_glibc": sys.argv[5],
          }, indent=2))
          PY
          python3 -m json.tool producer-provenance.json > /dev/null \
            || { echo "provenance is not valid JSON"; exit 2; }
          cat producer-provenance.json
      - name: Archive bundle tree (mode-preserving transport)
        run: |
          set -euo pipefail
          # Artifact upload/download normalizes modes to 0644, which
          # would strip +x from bin/haskoki-ctl and fail packaging
          # downstream: ship a tarball (modes live in tar headers).
          rm -f release-bundle.tar.gz
          tar -czf release-bundle.tar.gz dist-release
          tar tzf release-bundle.tar.gz > /dev/null \
            || { echo "bundle archive validation failed"; exit 2; }
          ls -la release-bundle.tar.gz
      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release-bundle.tar.gz
          if-no-files-found: error
      - name: Upload producer provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: producer-provenance
          path: producer-provenance.json
          if-no-files-found: error
      - name: Upload verified sdist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sdist
          path: dist-newstyle/sdist/haskoki-*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Build once from the staged release bundle, save candidate bytes/identity,
  # then test contracts, full and real compare in three parallel jobs. Every
  # prior assertion remains in the phase driver. Plain Docker sees the pulled
  # base tags; their effective digests remain recorded. The final demo-image
  # gate verifies all receipts before promoting the same saved bytes for publish.
  # ------------------------------------------------------------------
  demo-image-build:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Preflight (docker access, demo Dockerfile)
        run: |
          set -euo pipefail
          docker info >/dev/null || { echo "docker unavailable"; exit 2; }
          test -f docker/Dockerfile.demo || { echo "Dockerfile.demo missing"; exit 2; }
          echo "preflight ok"
      - name: Download staged bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: .
      - name: Extract staged bundle
        run: |
          set -euo pipefail
          test -f release-bundle.tar.gz || { echo "staged bundle missing"; exit 2; }
          tar xzf release-bundle.tar.gz
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          test -x "dist-release/haskoki-$VER/bin/haskoki-ctl" \
            || { echo "staged bundle lost the executable bit in transport"; exit 2; }
          echo "staged bundle extracted: dist-release/haskoki-$VER"
      - name: Establish base images (explicit pull)
        run: |
          set -euo pipefail
          # BuildKit resolves FROM sources into its cache without
          # guaranteeing image-store tags; pull explicitly so both
          # the driver build and the digest recording below see
          # named tags on a fresh runner.
          docker pull ubuntu:26.04
          docker pull rust:1.94-bookworm
          docker inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04
          docker inspect --format '{{index .RepoDigests 0}}' rust:1.94-bookworm
      - name: Build the demo candidate once (staged bundle)
        env:
          HASKOKI_DEMO_TEST_OUT: ${{ github.workspace }}/driver-out/build
          HASKOKI_DEMO_REVISION: ${{ github.sha }}
          HASKOKI_DEMO_USE_STAGED: "1"
        run: |
          set -euo pipefail
          time sh scripts/test-demo-image.sh build
      - name: Record image identity
        id: record
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          docker inspect --format 'id={{.Id}} size={{.Size}}' "haskoki-demo:$VER"
          docker inspect --format '{{json .Config.Labels}}' "haskoki-demo:$VER"
          echo "imageid=$(docker inspect --format '{{.Id}}' "haskoki-demo:$VER")" \
            >> "$GITHUB_OUTPUT"
          BASE_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04)
          case "$BASE_DIGEST" in
            ""|"<no value>") echo "base digest unreadable"; exit 2 ;;
          esac
          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "base: $BASE_DIGEST"
          RUST_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' rust:1.94-bookworm)
          case "$RUST_DIGEST" in
            ""|"<no value>") echo "rust digest unreadable"; exit 2 ;;
          esac
          echo "rust_digest=$RUST_DIGEST" >> "$GITHUB_OUTPUT"
          echo "rust: $RUST_DIGEST"
      - name: Save candidate bytes and identity
        env:
          BASE_DIGEST: ${{ steps.record.outputs.base_digest }}
          RUST_DIGEST: ${{ steps.record.outputs.rust_digest }}
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          mkdir -p candidate
          docker save "haskoki-demo:$VER" | gzip > candidate/demo-image.tar.gz
          python3 scripts/demo-image-shards.py capture \
            --archive candidate/demo-image.tar.gz --identity candidate/identity.json \
            --image "haskoki-demo:$VER" --source "$GITHUB_SHA" --version "$VER" \
            --base-digest "$BASE_DIGEST" --rust-digest "$RUST_DIGEST"
      - name: Upload candidate (not yet qualified)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-image-candidate
          path: candidate/
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-image-build-runs
          path: driver-out/
          if-no-files-found: warn

  demo-image-shards:
    needs: demo-image-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        phase: [contracts, full, compare]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download candidate bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-image-candidate
          path: candidate/
      - name: Verify archive identity before loading
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          python3 scripts/demo-image-shards.py verify-archive \
            --archive candidate/demo-image.tar.gz --identity candidate/identity.json \
            --source "$GITHUB_SHA" --version "$VER"
          docker load -i candidate/demo-image.tar.gz
      - name: Run assigned phase on the exact candidate
        env:
          HASKOKI_DEMO_TEST_OUT: ${{ github.workspace }}/driver-out/${{ matrix.phase }}
          HASKOKI_DEMO_REVISION: ${{ github.sha }}
          HASKOKI_DEMO_IDENTITY: ${{ github.workspace }}/candidate/identity.json
          HASKOKI_DEMO_ARCHIVE: ${{ github.workspace }}/candidate/demo-image.tar.gz
        run: |
          set -euo pipefail
          HASKOKI_DEMO_IMAGE=$(python3 -c 'import json; print(json.load(open("candidate/identity.json"))["imageid"])')
          export HASKOKI_DEMO_IMAGE
          time sh scripts/test-demo-image.sh "${{ matrix.phase }}"
      - name: Normalize shard output ownership
        if: always()
        run: |
          if [ -d driver-out ]; then
            sudo chown -R "$(id -u):$(id -g)" driver-out
            chmod -R u+rwX driver-out
          fi
      - name: Upload distinct shard reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-image-shard-${{ matrix.phase }}
          path: driver-out/
          if-no-files-found: error

  # Keep this check name and publish-facing outputs. always() makes a failed,
  # cancelled or skipped prerequisite a failed gate rather than a skipped check.
  # Receipts additionally reject missing shards or different source/image bytes.
  demo-image:
    needs: [demo-image-build, demo-image-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      imageid: ${{ steps.gate.outputs.imageid }}
      configid: ${{ steps.gate.outputs.configid }}
      base_digest: ${{ steps.gate.outputs.base_digest }}
      rust_digest: ${{ steps.gate.outputs.rust_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Fail closed on required job results
        env:
          BUILD_RESULT: ${{ needs.demo-image-build.result }}
          SHARDS_RESULT: ${{ needs.demo-image-shards.result }}
        run: |
          python3 scripts/demo-image-shards.py check-results \
            --build-result "$BUILD_RESULT" --shards-result "$SHARDS_RESULT"
      - name: Download candidate bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-image-candidate
          path: candidate/
      - name: Download all three shard reports (distinct subdirectories)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: demo-image-shard-*
          path: driver-out/
          merge-multiple: true
      - name: Verify complete same-source same-image qualification
        id: gate
        env:
          BUILD_RESULT: ${{ needs.demo-image-build.result }}
          SHARDS_RESULT: ${{ needs.demo-image-shards.result }}
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          python3 scripts/demo-image-shards.py gate \
            --archive candidate/demo-image.tar.gz --identity candidate/identity.json \
            --source "$GITHUB_SHA" --version "$VER" --runs driver-out \
            --build-result "$BUILD_RESULT" --shards-result "$SHARDS_RESULT"
          # Promote saved bytes only after all receipts pass. Never rebuild/save.
          cp candidate/demo-image.tar.gz demo-image.tar.gz
      - name: Download build logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-image-build-runs
          path: driver-out/
      - name: Upload tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-image-tested
          path: demo-image.tar.gz
          if-no-files-found: error
      - name: Upload complete run evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-image-runs
          path: driver-out/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish (CD): the only job with publication permissions. Main release
  # dispatches and owner-pushed tags use the same run's verified artifacts.
  # Local packaging (and signing, when a key is provisioned) precede
  # tag/registry writes. Tag/source, image configuration (including
  # labels and DiffIDs), and draft/run identities must agree;
  # conflicting identities and public releases fail.
  # Existing versioned images and draft assets are never overwritten.
  # An immutable same-run Actions checkpoint preserves the original files
  # before draft writes; retry verifies archive/metadata/signature and inputs.
  # The image is transferred by docker save/load, with the existing same-
  # runner .Id guard plus an independent saved-configuration digest for
  # registry comparison (Docker .Id varies across storage backends).
  # Bundle build environment comes from producer provenance, not this host.
  # Anonymous digest pull + demo/direct smoke precede draft creation.
  # Uploaded files (and the signature, when present) verify before
  # provenance attestations, latest update, and public release. The KAT
  # lane remains informational.
  # F-8 / FINAL-4: signing is OPTIONAL. When the owner provisions
  # HASKOKI_RELEASE_SIGNING_KEY, the secret is imported into an
  # ephemeral keyring, SHA256SUMS is signed, and the signature is
  # verified before anything ships. When the secret is absent the
  # release ships UNSIGNED (five assets, no SHA256SUMS.asc) with
  # checksums + SLSA attestations still applied. Publish never
  # creates keys.
  # ------------------------------------------------------------------
  publish:
    needs: [release-request, haskell, bundle, c-drivers, pkcs11-fast, demo-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      TAG: ${{ needs.release-request.outputs.tag }}
      VER: ${{ needs.release-request.outputs.version }}
      TESTED_ID: ${{ needs.demo-image.outputs.imageid }}
      TESTED_CONFIG_ID: ${{ needs.demo-image.outputs.configid }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Recheck source, tag and draft ownership before publication
        env:
          HASKOKI_RELEASE_SIGNING_KEY: ${{ secrets.HASKOKI_RELEASE_SIGNING_KEY }}
        run: python3 scripts/release-request.py publisher-preflight
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-image-tested
          path: image-in
      - name: Load and verify staged bytes (no push yet)
        run: |
          set -euo pipefail
          test -f image-in/demo-image.tar.gz || { echo "tested image missing"; exit 2; }
          gunzip -c image-in/demo-image.tar.gz | docker load
          LOADED_ID=$(docker inspect --format '{{.Id}}' "haskoki-demo:$VER")
          [ -n "$TESTED_ID" ] || { echo "tested id output missing"; exit 2; }
          [ "$LOADED_ID" = "$TESTED_ID" ] \
            || { echo "loaded $LOADED_ID != tested $TESTED_ID"; exit 2; }
          echo "staged bytes verified: $LOADED_ID"
      - name: Download bundle tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: .
      - name: Download verified sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sdist
          path: dist-newstyle/sdist
      - name: Download gate evidence for the results archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: haskell-test-log
          path: evidence-in/haskell
      - name: Download fast-lane report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkcs11-fast-report
          path: evidence-in/fast
      - name: Download demo-image run dirs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-image-runs
          path: evidence-in/demo
      - name: Download producer provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: producer-provenance
          path: provenance-in
      - name: Import release signing key (optional)
        env:
          HASKOKI_RELEASE_SIGNING_KEY: ${{ secrets.HASKOKI_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HASKOKI_RELEASE_SIGNING_KEY:-}" ]; then
            echo "no HASKOKI_RELEASE_SIGNING_KEY secret: release will ship unsigned"
            echo "HASKOKI_SIGNING_KEY=" >> "$GITHUB_ENV"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg-f8"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$HASKOKI_RELEASE_SIGNING_KEY" | gpg --batch --no-tty --import
          FPR=$(gpg --batch --no-tty --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          [ -n "$FPR" ] || { echo "imported key has no fingerprint"; exit 2; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "HASKOKI_SIGNING_KEY=$FPR" >> "$GITHUB_ENV"
          echo "release signing key imported ok"
      - name: Extract bundle and validate staged assets (pre-push)
        env:
          HASKOKI_PROVENANCE_FILE: provenance-in/producer-provenance.json
          HASKOKI_BASE_DIGEST: ${{ needs.demo-image.outputs.base_digest }}
          HASKOKI_RUST_DIGEST: ${{ needs.demo-image.outputs.rust_digest }}
          HASKOKI_SIGNING_KEY: ${{ env.HASKOKI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -f release-bundle.tar.gz || { echo "staged bundle missing"; exit 2; }
          tar xzf release-bundle.tar.gz
          VER=$(grep -m1 '^version:' haskoki.cabal | awk '{print $2}')
          test -x "dist-release/haskoki-$VER/bin/haskoki-ctl" \
            || { echo "staged bundle lost the executable bit in transport"; exit 2; }
          mkdir -p "dist-release/test-results-$VER"
          cp -r evidence-in/haskell evidence-in/fast evidence-in/demo \
            "dist-release/test-results-$VER"/
          sh scripts/package-release.sh dist-release
          (cd dist-release && sha256sum -c SHA256SUMS)
          echo "pre-push asset validation ok"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite different versioned image bytes
        run: python3 scripts/release-request.py registry
      - name: Create version tag on the checked source (never force)
        run: python3 scripts/release-request.py tag
      - name: Push exact tested version image when absent
        if: env.VERSION_IMAGE_EXISTS != '1'
        run: |
          set -euo pipefail
          docker tag "haskoki-demo:$VER" "ghcr.io/mingulov/haskoki-demo:$TAG"
          docker push "ghcr.io/mingulov/haskoki-demo:$TAG"
      - name: Verify registry bytes and record version digest
        env:
          REQUIRE_IMAGE: "1"
        run: python3 scripts/release-request.py registry
      - name: Require an anonymous digest pull and usable demo
        run: |
          set -euo pipefail
          ANON_CONFIG=$(mktemp -d "$RUNNER_TEMP/anonymous-docker.XXXXXX")
          trap 'rm -rf "$ANON_CONFIG"' EXIT
          if ! docker --config "$ANON_CONFIG" pull "$PUSHED_DIGEST"; then
            echo "GHCR package must be public before this release can finish."
            echo "Owner: https://github.com/users/mingulov/packages/container/haskoki-demo/settings"
            echo "Set visibility to Public, then Re-run failed jobs in this same run."
            echo "Do not start a new release or move the version tag."
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/pulled-demo"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/pulled-demo:/out" "$PUSHED_DIGEST" demo
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/pulled-demo:/out" "$PUSHED_DIGEST" \
            check --mode direct --profile smoke
      - name: Restore immutable same-run checkpoint when present
        run: python3 scripts/release-request.py restore-checkpoint
      - name: Finalize manifest with pushed digest
        if: env.RESTORED_CHECKPOINT != '1'
        env:
          HASKOKI_OCI_DIGEST: ${{ env.PUSHED_DIGEST }}
          HASKOKI_PROVENANCE_FILE: provenance-in/producer-provenance.json
          HASKOKI_BASE_DIGEST: ${{ needs.demo-image.outputs.base_digest }}
          HASKOKI_RUST_DIGEST: ${{ needs.demo-image.outputs.rust_digest }}
          HASKOKI_SIGNING_KEY: ${{ env.HASKOKI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "${HASKOKI_OCI_DIGEST:-}" ] || { echo "pushed digest missing"; exit 2; }
          sh scripts/package-release.sh dist-release
          (cd dist-release && sha256sum -c SHA256SUMS)
          echo "finalized manifest ok"
      - name: Verify release signature (when signed)
        run: |
          set -euo pipefail
          if [ ! -f dist-release/SHA256SUMS.asc ]; then
            echo "no SHA256SUMS.asc: unsigned release, nothing to verify"
            exit 0
          fi
          OUT=$(gpg --batch --no-tty --verify \
            dist-release/SHA256SUMS.asc dist-release/SHA256SUMS 2>&1)
          echo "$OUT"
          case "$OUT" in
            *'Good signature'*) echo "signature verifies: Good signature" ;;
            *) echo "SHA256SUMS.asc does not verify"; exit 2 ;;
          esac
      - name: Prepare original assets for immutable checkpoint
        if: env.RESTORED_CHECKPOINT != '1'
        run: python3 scripts/release-request.py prepare-checkpoint
      - name: Save original assets once (same run and source)
        if: env.RESTORED_CHECKPOINT != '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.run_id }}-${{ github.sha }}
          path: release-checkpoint/
          retention-days: 90
          overwrite: false
          if-no-files-found: error
      - name: Verify saved checkpoint before any draft writes
        if: env.RESTORED_CHECKPOINT != '1'
        env:
          REQUIRE_CHECKPOINT: "1"
        run: python3 scripts/release-request.py restore-checkpoint
      - name: Stage draft release and verify all uploaded files
        run: python3 scripts/release-request.py stage-draft
      - name: Attest release files (bundle + sdist provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/haskoki-*.tar.gz
      - name: Attest pushed image digest (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/mingulov/haskoki-demo
          subject-digest: ${{ env.PUSHED_DIGEST_ONLY }}
          push-to-registry: true
      - name: Publish latest only after versioned image and draft validation
        run: |
          set -euo pipefail
          docker tag "$PUSHED_DIGEST" ghcr.io/mingulov/haskoki-demo:latest
          docker push ghcr.io/mingulov/haskoki-demo:latest
      - name: Publish verified draft
        run: python3 scripts/release-request.py publish-draft
      - name: Release summary
        run: |
          {
            echo "Release: https://github.com/mingulov/haskoki/releases/tag/$TAG"
            echo "Source: $GITHUB_SHA"
            echo "Image: $PUSHED_DIGEST"
            echo "Anonymous digest pull, demo and direct smoke verified."
            if [ -f dist-release/SHA256SUMS.asc ]; then
              echo "Six signed release assets uploaded and verified."
            else
              echo "Five unsigned release assets uploaded and verified (no signing key)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Fetch the Wycheproof/ACVP/CCTV/x509-limbo vectors ONCE (shared via
  # cache); the kat lane restores this cache instead of re-downloading.
  # ------------------------------------------------------------------
  fetch-data:
    needs: release-request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mingulov/pkcs11-check
          ref: ${{ env.FRAMEWORK_REF }}
          path: pkcs11-check
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore / populate vector-data cache
        id: data-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: pkcs11-data-${{ hashFiles('pkcs11-check/src/pkcs11_check/testcases/data/sources.toml') }}
      - name: Fetch vectors (cache miss only)
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          uv sync --project pkcs11-check --frozen --extra dev
          uv run --project pkcs11-check pkcs11-check fetch-data all --data-dir data
          uv run --project pkcs11-check pkcs11-check fetch-disabled --data-dir data
      - name: Show data status
        run: uv run --project pkcs11-check pkcs11-check fetch-data --status --data-dir data || true

  # ------------------------------------------------------------------
  # Fast lane: offline markers, no vector data.
  # ------------------------------------------------------------------
  pkcs11-fast:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The staged bundle was built on ubuntu:26.04 (glibc 2.42+) and
    # cannot dlopen on the older host runner: run the lane in the
    # matching userland (haskell/c-drivers precedent).
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mingulov/pkcs11-check
          ref: ${{ env.FRAMEWORK_REF }}
          path: pkcs11-check
      - name: Base packages + uv
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl python3 libgmp10 libffi8 libnuma1
          # setup-uv cannot provision inside the job container (node
          # actions run on the host): install a pinned uv the same
          # URL + SHA256 way as the OpenSSL prefix.
          UV_VER=0.12.23
          UV_SHA=9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
          UV_TGZ="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/astral-sh/uv/releases/download/$UV_VER/$UV_TGZ"
          echo "$UV_SHA  $UV_TGZ" | sha256sum -c -
          tar xzf "$UV_TGZ" -C /tmp
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          rm -rf "$UV_TGZ" /tmp/uv-x86_64-unknown-linux-gnu
          uv --version
      - run: uv sync --project pkcs11-check --frozen --extra dev
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: .
      - name: Extract staged bundle
        run: |
          set -euo pipefail
          test -f release-bundle.tar.gz || { echo "staged bundle missing"; exit 2; }
          tar xzf release-bundle.tar.gz
          ART=$(echo dist-release/haskoki-*)
          test -f "$ART/lib/libhaskoki.so" || { echo "staged bundle broken: $ART"; exit 2; }
      - name: Run fast lane
        run: |
          ART=$(echo dist-release/haskoki-*)
          PKCS11_CHECK="uv run --project pkcs11-check pkcs11-check" \
            bash scripts/ci-pkcs11-lane.sh fast "$ART" pkcs11-fast-results.json
      - name: Summarize results
        if: always()
        run: |
          python3 - pkcs11-fast-results.json fast <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys, json
          path, lane = sys.argv[1], sys.argv[2]
          try:
              s = json.load(open(path)).get("summary", {})
              g = s.get
              print(f"### {lane}: {g('total', 0)} tests — "
                    f"{g('passed', 0)} passed, {g('failed', 0)} failed, "
                    f"{g('crashed', 0)} crashed, {g('timeout', 0)} timeout, "
                    f"{g('xfailed', 0)} xfailed, {g('skipped', 0)} skipped")
          except Exception as e:  # noqa: BLE001
              print(f"### {lane}: no JSON report ({e})")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkcs11-fast-report
          path: pkcs11-fast-results.json
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # KAT lane: full markers over the fetched vector data.
  # ------------------------------------------------------------------
  pkcs11-kat:
    needs: [bundle, fetch-data]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The staged bundle was built on ubuntu:26.04 (glibc 2.42+) and
    # cannot dlopen on the older host runner: run the lane in the
    # matching userland (haskell/c-drivers precedent).
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mingulov/pkcs11-check
          ref: ${{ env.FRAMEWORK_REF }}
          path: pkcs11-check
      - name: Base packages + uv
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl python3 libgmp10 libffi8 libnuma1
          # setup-uv cannot provision inside the job container (node
          # actions run on the host): install a pinned uv the same
          # URL + SHA256 way as the OpenSSL prefix.
          UV_VER=0.12.23
          UV_SHA=9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
          UV_TGZ="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/astral-sh/uv/releases/download/$UV_VER/$UV_TGZ"
          echo "$UV_SHA  $UV_TGZ" | sha256sum -c -
          tar xzf "$UV_TGZ" -C /tmp
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          rm -rf "$UV_TGZ" /tmp/uv-x86_64-unknown-linux-gnu
          uv --version
      - run: uv sync --project pkcs11-check --frozen --extra dev
      - name: Restore vector-data cache
        id: data-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: pkcs11-data-${{ hashFiles('pkcs11-check/src/pkcs11_check/testcases/data/sources.toml') }}
      - name: Fetch vectors (cache miss only)
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          # Self-healing: the fetch-data job normally warms this
          # cache, but a restore miss must not fail a 180-minute
          # lane — fetch inline (same commands as fetch-data).
          uv run --project pkcs11-check pkcs11-check fetch-data all --data-dir data
          uv run --project pkcs11-check pkcs11-check fetch-disabled --data-dir data
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: .
      - name: Extract staged bundle
        run: |
          set -euo pipefail
          test -f release-bundle.tar.gz || { echo "staged bundle missing"; exit 2; }
          tar xzf release-bundle.tar.gz
          ART=$(echo dist-release/haskoki-*)
          test -f "$ART/lib/libhaskoki.so" || { echo "staged bundle broken: $ART"; exit 2; }
      - name: Run KAT lane
        run: |
          ART=$(echo dist-release/haskoki-*)
          PKCS11_CHECK="uv run --project pkcs11-check pkcs11-check" \
            bash scripts/ci-pkcs11-lane.sh kat "$ART" pkcs11-kat-results.json
      - name: Summarize results
        if: always()
        run: |
          python3 - pkcs11-kat-results.json kat <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys, json
          path, lane = sys.argv[1], sys.argv[2]
          try:
              s = json.load(open(path)).get("summary", {})
              g = s.get
              print(f"### {lane}: {g('total', 0)} tests — "
                    f"{g('passed', 0)} passed, {g('failed', 0)} failed, "
                    f"{g('crashed', 0)} crashed, {g('timeout', 0)} timeout, "
                    f"{g('xfailed', 0)} xfailed, {g('skipped', 0)} skipped")
          except Exception as e:  # noqa: BLE001
              print(f"### {lane}: no JSON report ({e})")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkcs11-kat-report
          path: pkcs11-kat-results.json
          if-no-files-found: warn


