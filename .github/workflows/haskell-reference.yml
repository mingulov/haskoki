# Validates the executable Haskell reference: the logout-journey
# example plus the independent logout-oracle suite. Core-only
# components (no OpenSSL prefix, no C toolchain beyond the
# container base): the reference must stay buildable on stock GHC.
#
# Pin policy: same as ci.yml — every third-party action pinned to a
# full commit SHA with the tag as a trailing comment
# (checkout v7.0.1, cache v6.1.0, upload-artifact v7.0.2). Coverage of this file by
# scripts/check-actions-pinned.py follows at integration time.
name: Haskell reference

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # reference (container, same base GHC line as the Dockerfile).
  # ------------------------------------------------------------------
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ubuntu:26.04
    env:
      # Keep the cabal store on the mounted workspace so the cache
      # action (host-side) can persist it across runs.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Base packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ghc cabal-install libgmp-dev git perl curl \
            ca-certificates python3
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Restore cabal store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cabal
          key: cabal-store-reference-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            cabal-store-reference-
      - name: History gate (build-free)
        run: |
          set -euo pipefail
          python3 scripts/check-history-codes.py
      - name: Build example and oracle
        run: |
          set -euo pipefail
          mkdir -p reference-logs
          cabal update
          cabal build exe:logout-journey test-suite:haskoki-logout-oracle-tests \
            2>&1 | tee reference-logs/build.log
      - name: Run example and oracle
        run: |
          set -euo pipefail
          mkdir -p reference-logs
          cabal run exe:logout-journey 2>&1 | tee reference-logs/logout-journey.log
          cabal test haskoki-logout-oracle-tests --test-show-details=direct \
            2>&1 | tee reference-logs/logout-oracle.log
      - name: Receipt (revision and toolchain)
        # Runs even after a failure, so the logs above always carry the
        # revision and the stock toolchain they were produced with.
        if: always()
        env:
          RECEIPT_REVISION: ${{ github.sha }}
          RECEIPT_REF: ${{ github.ref }}
          RECEIPT_RUN: ${{ github.run_id }}
          RECEIPT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p reference-logs
          {
            echo "revision: $RECEIPT_REVISION"
            echo "ref: $RECEIPT_REF"
            echo "run: $RECEIPT_RUN attempt $RECEIPT_ATTEMPT"
            echo "ghc: $(ghc --numeric-version 2>&1 || echo unavailable)"
            echo "cabal: $(cabal --numeric-version 2>&1 || echo unavailable)"
            echo "image: ubuntu:26.04"
          } > reference-logs/receipt.txt
          cat reference-logs/receipt.txt
      - name: Upload reference logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haskell-reference-logs
          path: reference-logs/
          if-no-files-found: error
