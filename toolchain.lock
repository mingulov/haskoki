# haskoki toolchain lock (GHC 9.10.3; frozen 2026-09-24).
#
# The environment is the Docker image below. It carries the full
# toolchain plus prebuilt project deps and baked passing tests, so a fresh
# machine needs only Docker + `docker load`.
# Rebuild:  cd haskoki && docker build -t <image> .
# Re-verify: docker run --rm <image> bash -c 'cd /work && cabal test all'

[image]
tag = haskoki-dev:ghc-9.10.3
id = sha256:5383beb2b6b3d8744f4fe49c6025b3aaf61ef0301a05a01a679519498601faa5
size = 3.8GB
base = ubuntu:26.04

[compiler]
ghc-numeric-version = 9.10.3
ghc-source = OS package (Ubuntu 26.04 universe)
default-edition = GHC2024
minimum = 9.10 (-Wincomplete-record-selectors is a fatal omission class)

[tools]
ghcup = n/a (default toolchain uses OS packages)
cabal-install = 3.12.1.0
gcc = 15.2.0 (Ubuntu 26.04.1; container: build-essential on ubuntu:26.04)
ld = GNU ld 2.46 (GNU Binutils for Ubuntu)
glibc = 2.43 (Ubuntu GLIBC 2.43-2ubuntu2.4; x86-64)

[boot-libraries]
base = 4.20.2.0
template-haskell = 2.22.0.0
containers = 0.7
bytestring = 0.12.2.0
text = 2.1.3
stm = 2.5.3.1
array = 0.5.8.0

[hackage-pins]
index-state = hackage.haskell.org 2026-09-20T08:53:27Z
tasty = 1.5.4
tasty-hunit = 0.10.2
freeze-file = cabal.project.freeze

[verified]
cabal-test = PASS (core 221/221, tests 2/2, storage 58/58, engine 147/147, prop 54/54, model 784/784; native GHC 9.10.3, 2026-09-24)
cabal-test-image = PASS (in-image /work during build, 2026-09-24)
warnings = EMPTY (forced native build, 0 warnings)
make-release = PASS (native; 24 bundled libHS; host deps system-only incl. libffi/libnuma; glibc floor 2.43)

[openssl-freeze]
# Loader-proof facts for the toolchain (GHC 9.10.3). The
# supported-loader policy below is the whole story.
flib = foreign-library haskoki, type native-shared
soname = libhaskoki.so
so-path = dist-newstyle/build/x86_64-linux/ghc-9.10.3/haskoki-0.3.0.0/f/haskoki/build/haskoki/libhaskoki.so
ghc-options-flib = -Wall -threaded
cc-options-flib = -Wall -Wextra -std=c11 -pthread
ld-options-flib = -Wl,-z,nodelete -pthread
rts = threaded, dynamic (libHSrts-1.0.2_thr-ghc9.10.3.so)
needed = libm.so.6, 24x libHS (base-4.20.2.0, ghc-prim-0.12.0, ghc-internal-9.1003.0, rts-1.0.2_thr, ...), libgmp.so.10, libffi.so.8, libnuma.so.1, libc.so.6
pinning = DF_1_NODELETE (FLAGS_1: NODELETE)
hs-exit = absent: no call-site in cbits/ ffi/, no symbol in cbits objects, no dynamic ref in libhaskoki.so
package-set = unchanged from [hackage-pins] above (flib adds base-only Haskell module; no new deps)
# Supported-loader policy: Linux x86-64 only, one loaded
# haskoki build per process; dlclose/dlopen freely (NODELETE retains
# code + interval state); join native threads before C_Finalize (no
# admission leases yet); fork-without-exec children get documented safe
# failures (stateful -> CKR_CRYPTOKI_NOT_INITIALIZED, init ->
# CKR_GENERAL_ERROR) and must exec for a fresh instance; no-thread
# hosts refused (CKR_NEED_TO_CREATE_THREADS).
# Fork safety: every entry gates on the boot PID recorded at RTS
# start; see SUPPORTED-HOSTS.md.

[openssl]
# Pinned libcrypto for the OpenSSL4 backend (Dockerfile
# openssl-build stage; REPORT.md §5.1 format).
version = 4.0.2
release-date = 25 Aug 2026
eol = 14 May 2027
shlib-version = 4
tarball-url = https://github.com/openssl/openssl/releases/download/openssl-4.0.2/openssl-4.0.2.tar.gz
tarball-sha256 = 736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8
tarball-sha256-verified = yes (spike recompute + engine staged-build check, MATCH)
pgp-key = B146 647E 45A7 B339 47AB 226B 2A2C 87D1 6169 2D40 (spike verified Good sig)
configure-flags = --prefix=/opt/openssl-4.0.2 --openssldir=/opt/openssl-4.0.2/ssl --libdir=lib no-docs no-tests threads no-shared no-pinshared linux-x86_64
linkage = static libcrypto.a only (no shared libcrypto in NEEDED; no-pinshared for .so embedding)
prefix-container = /opt/openssl-4.0.2 (OPENSSL4_PREFIX; staged at /tmp/ossl4-stage for pre-rebuild runs)
fips = out of scope (default provider only)
proof-sha256-abc = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
proof-version-string = OpenSSL 4.0.2 25 Aug 2026
