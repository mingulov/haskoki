# Frozen checker profiles for `haskoki-demo check` / `compare`.
# The compare subset is recorded in compare-classify/frozen-subset.tsv.
# This file is SOURCED by the entrypoint (shell assignments; quote values).
#
# smoke = small fast subset: the offline marker plus a -k selection over
#   the interface/slot/digest/profiles checker categories:
#   743 collected cases, zero findings in both direct and proxy modes.
# full = everything smoke does plus the rest of the checker surface: the
#   offline marker over the whole suite (no -k selection). The current
#   checker 0.2.3 record has 10983 collected cases and 18 shared findings
#   in each mode. scripts/test-demo-image.sh asserts the exact finding set;
#   docs/release-results.md retains older measurements as history.
# The offline marker is the CI fast-lane marker verbatim
# (scripts/ci-pkcs11-lane.sh): vector-data lanes need fetched data and
# stay out of the offline demo image.
SMOKE_MARKER='not (wycheproof or acvp or cctv or stress or fuzz or slow)'
SMOKE_MATCH='interface or slot or digest or profiles'
FULL_MARKER='not (wycheproof or acvp or cctv or stress or fuzz or slow)'
FULL_MATCH=''
CHECK_TIMEOUT=180
# Per-test timeout is per mode (the entrypoint selects by lane
# mode): the proxy pays ~21x on round-trip-heavy units
# (measured 2026-10-08, checker 0.2.3: RNG benchmark 163s
# proxy vs 7.6s direct; a 180s budget flaked the proxy lane
# under load while direct keeps 24x headroom). Proxy gets
# 360 (2.2x over typical). A true hang still fails loudly —
# the bound only has to be finite, not tight.
CHECK_TIMEOUT_PROXY=360
CHECK_SLOT=0
