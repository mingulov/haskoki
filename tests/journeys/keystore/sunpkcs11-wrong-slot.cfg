# SunPKCS11 provider configuration for the wrong-slot refusal leg.
# Identical to sunpkcs11-keystore.cfg except slot 9, which the token
# does not offer, so provider login fails and the leg records the
# expected refusal. Like its sibling it carries no generate templates
# and no destroyTokenAfterLogout.
#
# Runner substitution: replace @MODULE@ with the absolute path of the
# exact libhaskoki.so under test. The runner records the substituted
# file bytes (it carries no secrets) with the evidence record.
#
# The session-key tests/journeys/sunpkcs11/sunpkcs11.cfg cannot serve
# here either: it targets slot 0 session objects, not a persistent
# KeyStore entry on another slot.
name = HaskokiKeyStore
library = @MODULE@
slot = 9
