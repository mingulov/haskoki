# SunPKCS11 provider configuration for the KeyStore application legs.
# Persistent token objects: the application keypair (label app-key, id
# 0202) and its leaf certificate are written by pkcs11-tool, then read
# back in a fresh process. No generate templates appear here, and no
# destroyTokenAfterLogout is set, so token objects survive logout.
#
# Runner substitution: replace @MODULE@ with the absolute path of the
# exact libhaskoki.so under test. The runner records the substituted
# file bytes (it carries no secrets) with the evidence record.
#
# The session-key tests/journeys/sunpkcs11/sunpkcs11.cfg cannot serve
# the KeyStore: it sets destroyTokenAfterLogout and forces generated
# keys to session objects (CKA_TOKEN = false), so nothing it creates
# persists for a later process to list or sign with.
name = HaskokiKeyStore
library = @MODULE@
slot = 0
