# Junction config: certificate-linked application legs (Java KeyStore
# journey) of the supported-client portfolio. SQLite store: the
# application journey persists a certificate object together with its
# key objects under one CKA_ID, closes the process, and reopens the
# same store to prove the linked identity survived. Single writer:
# only one client process may hold this store at a time.
#
# Runner substitution: replace @JOURNEY_DIR@ with the absolute path of
# a fresh empty directory owned by the run. The runner records the
# substituted file bytes with the evidence record.
schema_version = 1
profile = "demo-maximal"

[storage]
kind = "sqlite"
path = "@JOURNEY_DIR@/keystore-tokens.db"

[engine]
kind = "openssl"
allow_synthetic_fallback = false
private_library_context = true

[trace]
enabled = false
