# SunPKCS11 provider configuration for the Java journey legs.
# Follows the reviewed probe contract (diagnostic branch,
# tests/review/java-probe.md): slot 0, session key objects, provider
# token resources disposed after logout. The attributes blocks keep
# generated keys as session objects so the memory store stays fresh
# and no key bytes outlive the probe process.
#
# Runner substitution: replace @MODULE@ with the absolute path of the
# exact libhaskoki.so under test. The runner records the substituted
# file bytes (it carries no secrets) with the evidence record.
name = HaskokiJourney
library = @MODULE@
slot = 0
destroyTokenAfterLogout = true
attributes(generate, CKO_PUBLIC_KEY, CKK_EC) = {
  CKA_TOKEN = false
  CKA_PRIVATE = false
  CKA_VERIFY = true
}
attributes(generate, CKO_PRIVATE_KEY, CKK_EC) = {
  CKA_TOKEN = false
  CKA_PRIVATE = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
  CKA_SIGN = true
}
