# Proposed configuration contract; the provider is not implemented by this bundle.
# Fixture credentials are test data only. Do not use production secrets.
schema_version = 1
profile = "real-crypto"
interfaces = ["2.40", "3.0", "3.1", "3.2"]
seed = 1234

[storage]
kind = "memory"

[engine]
kind = "openssl"
allow_synthetic_fallback = false
private_library_context = true

[async]
executor = "logical"
enabled = false
pending_polls = 2
persist_detached = false
# Memory mode survives provider finalize/reinitialize, not process exit.

[trace]
enabled = true
path = "./hsp11-{pid}.jsonl"
redact_secrets = true
queue_limit = 4096

[control]
enabled = true
max_request_bytes = 1048576
response_budget_bytes = 65536

[fixtures]
set = "minimal-demo"
apply = "new-store-only"

[limits]
slots = 16
sessions = 1024
objects = 100000
buffer_bytes = 67108864
transcript_bytes = 67108864
aggregate_payload_bytes = 268435456
attribute_entries = 4096
attribute_depth = 8
jobs = 1024
events = 1024
